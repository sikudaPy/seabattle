---
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.11
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: python3 manage.py runserver 0.0.0.0:443
  containerPort: 443
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
